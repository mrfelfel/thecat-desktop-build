name: TheCat Windows deps

# Libraries/ is the bulk of a Windows build's wall clock: 35 stages of C and
# C++ compiled from scratch take about 90 minutes on a 4-core runner. It only
# changes when prepare.py or the pinned toolset does, so building it here once
# and handing it to the app build as an artifact takes those 90 minutes out of
# every ordinary build.
#
# actions/cache cannot do this: it only saves on job success, and the app build
# has been failing for reasons that have nothing to do with Libraries.

on:
  push:
    branches: [main]
    paths:
      - 'tdesktop/Telegram/build/prepare/prepare.py'
      - '.github/workflows/thecat-windows-deps.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Build and publish Libraries
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      TDESKTOP_SRC: ${{ github.workspace }}\tdesktop
      TOOLSET: 14.44.35207

    steps:
      - name: Clone.
        uses: actions/checkout@v5

      - name: Native tools environment.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          # Must match the app build exactly; see thecat-windows.yml.
          toolset: ${{ env.TOOLSET }}

      - name: Build dependencies.
        shell: cmd
        # win.bat rather than deploy\prepare-win.bat: the latter also brands
        # and configures, and this job's whole output is Libraries/ and
        # ThirdParty/. Branding would only add time and a failure mode.
        run: |
          pushd "%TDESKTOP_SRC%\Telegram"
          call build\prepare\win.bat silent
          popd

      - name: Report what was produced.
        shell: pwsh
        run: |
          foreach ($d in "Libraries", "ThirdParty") {
            if (-not (Test-Path $d)) { throw "$d is missing after prepare" }
            $items = (Get-ChildItem $d -Recurse -File | Measure-Object Length -Sum)
            "{0}: {1} files, {2:N0} MB" -f $d, $items.Count, ($items.Sum / 1MB)
          }
          # Which top-level dependency is actually the heavy one, so the trim
          # below can be reasoned about instead of guessed at.
          Get-ChildItem Libraries -Directory |
            ForEach-Object {
              $s = (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum)
              [pscustomobject]@{ Name = $_.Name; MB = [math]::Round($s.Sum / 1MB) }
            } |
            Sort-Object MB -Descending | Select-Object -First 12 |
            Format-Table -AutoSize | Out-String -Width 200

      - name: Trim what a later build never reads.
        shell: pwsh
        # The tree is 18 GB, mostly object files and program databases left
        # behind by the 35 prepare stages. A cold build reads headers and the
        # final .lib/.a/.dll only, so dropping intermediates shrinks the
        # artifact without changing what compiles or links.
        run: |
          # .exp is deliberately absent: it is the import file a DLL's
          # consumers link against, not an intermediate. .obj is not on the
          # list either: a restored tree still has to satisfy the build's
          # dependency checks, and a missing object forces the whole prepare
          # again.
          $extensions = @('.pdb', '.ilk', '.iobj', '.ipdb')
          $measure = {
            (Get-ChildItem Libraries, ThirdParty -Recurse -File -ErrorAction SilentlyContinue |
              Measure-Object Length -Sum).Sum / 1MB
          }
          $before = & $measure
          Get-ChildItem Libraries, ThirdParty -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in $extensions } |
            Remove-Item -Force -ErrorAction SilentlyContinue
          $after = & $measure
          "trimmed: {0:N0} MB -> {1:N0} MB" -f $before, $after

      - name: Publish Libraries.
        uses: actions/upload-artifact@v5
        with:
          name: thecat-windows-deps-mt1444
          path: |
            Libraries
            ThirdParty
          # Short retention: this is a build cache, not a release. It is
          # rebuilt on demand whenever prepare.py changes.
          retention-days: 7
          compression-level: 0

name: TheCat macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-macos.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-macos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: TheCat macOS arm64
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      TDESKTOP_SRC: ${{ github.workspace }}/tdesktop
      BUILD_TYPE: Release

    steps:
      - name: Clone.
        uses: actions/checkout@v5

      - name: Set up Homebrew toolchain.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          # Keep debug symbols out of the Release build; the tree is huge.
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-thecat-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-libs-

      - name: Patch and brand.
        # Pillow is needed even on macOS: brand_thecat.py builds the Dock icon
        # and the menu-bar silhouette, which sips cannot do.
        # Homebrew's python is externally managed (PEP 668), so this goes into
        # a venv that the rest of the job keeps on PATH.
        run: |
          python3 -m venv "$RUNNER_TEMP/brand-venv"
          echo "$RUNNER_TEMP/brand-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/brand-venv/bin/python" -m pip install --quiet pillow
          "$RUNNER_TEMP/brand-venv/bin/python" patch_thecat_endpoint.py
          "$RUNNER_TEMP/brand-venv/bin/python" brand_thecat.py

      - name: Restore prepared Libraries.
        id: deps
        uses: actions/download-artifact@v5
        with:
          name: thecat-macos-deps
          # Produced by thecat-macos-deps.yml. Absent on the first run after a
          # prepare.py change, in which case the step below rebuilds the tree.
          path: .
        continue-on-error: true

      - name: Report which dependencies arrived.
        run: |
          for d in Libraries ThirdParty; do
            if [ -d "$d" ]; then
              echo "$d: $(find "$d" -type f | wc -l | tr -d ' ') files"
            else
              echo "$d: absent, prepare will build it"
            fi
          done

      - name: Prepare libraries.
        # No skip-release. On mac the "release:" lines are where tg_owt's
        # Release.x86_64 and Release.arm64, tde2e's out/Release and openssl3's
        # lipo come from; skip-release leaves those Debug-only and the app
        # links Release. With the artifact restored this is a no-op: every
        # stage finds a good cache key and skips.
        run: ./tdesktop/Telegram/build/prepare/mac.sh silent

      - name: Check linked libraries.
        # The Xcode project links these straight out of Libraries/, not from
        # the installed prefix. Fail here with the offending path instead of
        # 2.5 hours later inside a clang++ link line.
        run: |
          for f in Libraries/rnnoise/out/Release/librnnoise.a \
                   Libraries/tg_owt/out/Release/libtg_owt.a \
                   Libraries/tde2e/out/Release/tde2e/libtde2e.a \
                   Libraries/tde2e/out/Release/tdutils/libtdutils.a \
                   Libraries/local/Qt-6.11.2/lib/libQt6Core.a \
                   Libraries/local/src/wallet_engine/wallet_engine.cpp; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Free up disk space.
        # prepare.py writes Libraries/ and ThirdParty/ beside the checkout
        # (repo root), not inside tdesktop/.
        # Remove only scratch data that nothing links against later: git
        # metadata, rustup, package-manager caches. Never 'out' — the app links
        # static archives such as Libraries/rnnoise/out/Release/librnnoise.a
        # and Libraries/tg_owt/out/Release/libtg_owt.a straight from there.
        # Nothing under Libraries/local/ is touched either: that is the
        # installed prefix the app and Qt's exported CMake targets reference,
        # including the generated wallet_engine.cpp.
        run: |
          find Libraries ThirdParty -type d \
            \( -name '.git' -o -name 'target' -o -name '.cargo' \
               -o -name 'rustup' \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
          find ThirdParty -maxdepth 3 -type d \( -name 'tmp' -o -name 'cache' \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Configure and build.
        run: |
          cd tdesktop/Telegram
          # Test-only Telegram API credentials; theCat's server does not validate api_id.
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf \
            -D TDESKTOP_API_ID=17349 \
            -D TDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Release --target Telegram --parallel

      - name: Package TheCat.app.
        run: |
          cd tdesktop/out/Release
          APP=$(find . -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle in out/Release"
            ls -la
            exit 1
          fi
          echo "Packing $APP"

          # The Release build keeps a full symtab (2.2M symbols here, most of
          # the binary's 1.8 GB). Strip it and re-sign ad-hoc, or macOS
          # refuses the bundle outright and the download is unusable.
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "Before strip: $(du -h "$BIN" | cut -f1)"
          strip -x -S "$BIN" || true
          echo "After strip:  $(du -h "$BIN" | cut -f1)"

          # Nested frameworks must carry their own signature before the
          # bundle is signed; --deep alone reuses theirs and then fails
          # verification because they were ad-hoc-signed at build time.
          find "$APP/Contents/Frameworks" -type f -name '*.dylib' -print0 2>/dev/null |
            while IFS= read -r -d '' lib; do
              codesign --force --sign - "$lib"
            done
          codesign --force --sign - "$BIN"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Signed ad-hoc and verified"
          # ditto preserves the executable bit and bundle layout.
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifact/TheCat-macos-arm64.zip

      - name: Upload TheCat macOS.
        uses: actions/upload-artifact@v5
        with:
          name: TheCat-macos-arm64
          path: tdesktop/out/Release/artifact/
          retention-days: 14

      - name: Publish release.
        # A rolling tag rather than a new one per build: the app is built from
        # main, so each successful build replaces the asset users download.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=thecat-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "TheCat latest" \
            --notes "Automatic build of main (${{ github.sha }})."
          gh release upload "$TAG" \
            tdesktop/out/Release/artifact/TheCat-macos-arm64.zip \
            --clobber

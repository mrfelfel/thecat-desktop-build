name: TheCat Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: TheCat Windows x64
    runs-on: windows-latest

    env:
      TDESKTOP_SRC: ${{ github.workspace }}\tdesktop
      BUILD_TYPE: Release

    steps:
      - name: Clone.
        uses: actions/checkout@v5

      - name: Expose ATL at the VC root.
        shell: pwsh
        # breakpad's gyp-generated projects hardcode "$(VSInstallDir)/VC/atlmfc",
        # i.e. VC\atlmfc at the install root. The runner image only ships ATL
        # inside a toolset (VC\Tools\MSVC\<ver>\atlmfc) and has no VC\atlmfc, so
        # dump_syms fails with C1083 atlbase.h and then LNK1104 atls.lib even
        # though MSBuild resolves ATL on its own.
        #
        # A junction rather than a copy: ATL is small but version-locked, and a
        # link keeps it identical to the toolset that actually compiles.
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          $root = Join-Path $vc "atlmfc"
          if (-not (Test-Path (Join-Path $root "include\atlbase.h"))) {
            # Newest toolset that actually ships ATL.
            $source = Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory |
              ForEach-Object {
                $atl = Join-Path $_.FullName "atlmfc"
                if (Test-Path (Join-Path $atl "include\atlbase.h")) {
                  [pscustomobject]@{ Path = $atl; Version = $_.Name }
                }
              } |
              Sort-Object Version |
              Select-Object -Last 1
            if (-not $source) { throw "no toolset under $vc\Tools\MSVC ships ATL" }
            New-Item -ItemType Junction -Path $root -Target $source.Path -Force | Out-Null
            "ATL ($($source.Version)): $root -> $($source.Path)"
          } else {
            "ATL already present at $root"
          }
          "atlbase.h: $(Test-Path (Join-Path $root 'include\atlbase.h'))"
          "atls.lib : $(Test-Path (Join-Path $root 'lib\x64\atls.lib'))"

      - name: Native tools environment.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
        # No toolset pin: run_cmake.py passes -T v143, which MSBuild resolves
        # to the newest installed toolset. Pinning an older one left the build
        # on a compiler whose ATL does not exist on the image.

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thecat-thirdparty-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-thirdparty-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: Libraries
          # v2: the Make-breakpad-link-ATL step edits Libraries/patches/,
          # so cached libraries built before it must not be reused.
          key: ${{ runner.os }}-thecat-libs-v2-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-libs-v2-

      - name: Make breakpad link ATL.
        # dump_syms links atls.lib, but gyp emits an explicit /LIBPATH list
        # (Win7 SDK and DIA SDK only) that overrides LIB, so exporting LIB
        # is not enough. UseOfAtl makes MSBuild contribute the ATL directories
        # itself.
        #
        # The diff lives under Libraries/, which is gitignored and restored
        # from cache, so it can only be adjusted here, before prepare.py
        # applies it. Hand-editing a hunk's line counts corrupts the diff, so
        # the hunk is regenerated: apply the patch, edit common.gypi, diff it.
        shell: pwsh
        run: |
          $patch = "Libraries\patches\breakpad.diff"
          if (-not (Test-Path $patch)) {
            throw "$patch not found; does prepare.py still ship it?"
          }
          if ((Get-Content $patch -Raw) -match 'UseOfAtl') {
            "breakpad.diff already sets UseOfAtl"
            exit 0
          }

          $tmp = Join-Path $env:RUNNER_TEMP "bpgen"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null

          git clone -q https://chromium.googlesource.com/breakpad/breakpad "$tmp/bp"
          if ($LASTEXITCODE -ne 0) { throw "breakpad clone failed" }
          Push-Location "$tmp/bp"
          git checkout -q dfcb7b6799
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw "shipped breakpad.diff does not apply; fix it instead" }
          git -c user.email=ci@local -c user.name=ci commit -qam baseline
          Pop-Location

          $gypi = Join-Path $tmp "bp/src/build/common.gypi"
          $lines = [System.Collections.Generic.List[string]](Get-Content $gypi)
          $done = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if (-not $done -and $lines[$i] -eq "            ]," -and $i -ge 2 `
                -and $lines[$i-1] -eq "              'delayimp.lib'," `
                -and $lines[$i-2] -eq "            'AdditionalDependencies': [") {
              # Inside VCLinkerTool, right after the array closes.
              $lines.Insert($i + 1, "            'UseOfAtl': 'Static',")
              $done = $true
              break
            }
          }
          if (-not $done) { throw "could not find AdditionalDependencies to extend" }
          # -NoNewline plus an explicit LF join: Set-Content alone would write
          # CRLF and the regenerated diff would no longer match the file.
          [IO.File]::WriteAllText($gypi, ($lines -join "`n") + "`n")

          Push-Location "$tmp/bp"
          $hunk = git diff -- src/build/common.gypi
          Pop-Location

          Add-Content $patch -Value $hunk
          "Appended a common.gypi hunk setting UseOfAtl=Static"

      - name: Patch, brand and prepare.
        shell: cmd
        run: call deploy\prepare-win.bat

      - name: Build TheCat.
        shell: cmd
        run: |
          cd /d %TDESKTOP_SRC%
          cmake --build out --config %BUILD_TYPE% --target Telegram --parallel

      - name: Collect TheCat.exe.
        shell: cmd
        run: |
          if not exist tdesktop\out\Release\TheCat.exe (
            echo ::error::build produced no TheCat.exe
            dir tdesktop\out\Release
            exit /b 1
          )
          mkdir artifact
          move tdesktop\out\Release\TheCat.exe artifact\
          if exist tdesktop\out\Release\Updater.exe move tdesktop\out\Release\Updater.exe artifact\

      - name: Upload TheCat.exe.
        uses: actions/upload-artifact@v5
        with:
          name: TheCat-windows-x64
          path: artifact\
          retention-days: 14

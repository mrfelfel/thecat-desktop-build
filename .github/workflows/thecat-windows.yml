name: TheCat Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: TheCat Windows x64
    runs-on: windows-latest

    env:
      TDESKTOP_SRC: ${{ github.workspace }}\tdesktop
      BUILD_TYPE: Release

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Add ATL to the pinned toolset.
        shell: pwsh
        # prepare.py builds breakpad's dump_syms with msbuild /WX, which needs
        # atlbase.h/atlcomcli.h (C1083) and atls.lib (LNK1104). The image
        # installs ATL only for its default toolset, so the pinned 14.44 tree
        # has no VC\atlmfc. Copy the ATL headers and libraries onto it.
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          $target = Join-Path $vs "Tools\MSVC\14.44.35207\atlmfc"
          if (Test-Path (Join-Path $target "lib")) { "ATL already present"; exit 0 }
          $source = Join-Path $vs "atlmfc"
          if (-not (Test-Path $source)) {
            $source = (Get-ChildItem (Join-Path $vs "Tools\MSVC") -Directory |
              ForEach-Object { Join-Path $_.FullName "atlmfc" } |
              Where-Object { Test-Path $_ } | Select-Object -First 1)
          }
          if (-not $source) { throw "no ATL directory found under $vs" }
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item (Join-Path $source "include") $target -Recurse -Force
          Copy-Item (Join-Path $source "lib") $target -Recurse -Force
          "ATL: $source -> $target"

      - name: Native tools environment.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          toolset: '14.44'

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thecat-thirdparty-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-thirdparty-
          save-always: true

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.os }}-thecat-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-libs-
          save-always: true

      - name: Patch, brand and prepare.
        shell: cmd
        run: call deploy\prepare-win.bat

      - name: Build TheCat.
        shell: cmd
        run: |
          cd /d %TDESKTOP_SRC%
          cmake --build out --config %BUILD_TYPE% --target Telegram --parallel

      - name: Collect TheCat.exe.
        shell: cmd
        run: |
          if not exist tdesktop\out\Release\TheCat.exe (
            echo ::error::build produced no TheCat.exe
            dir tdesktop\out\Release
            exit /b 1
          )
          mkdir artifact
          move tdesktop\out\Release\TheCat.exe artifact\
          if exist tdesktop\out\Release\Updater.exe move tdesktop\out\Release\Updater.exe artifact\

      - name: Upload TheCat.exe.
        uses: actions/upload-artifact@v4
        with:
          name: TheCat-windows-x64
          path: artifact\
          retention-days: 14

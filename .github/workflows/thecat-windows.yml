name: TheCat Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: TheCat Windows x64
    runs-on: windows-latest

    env:
      TDESKTOP_SRC: ${{ github.workspace }}\tdesktop
      BUILD_TYPE: Release

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Expose ATL at the VC root.
        shell: pwsh
        # breakpad's gyp-generated dump_syms.vcxproj hardcodes
        # "$(VCInstallDir)VC\atlmfc\include". The image only ships ATL inside a
        # toolset dir (VC\Tools\MSVC\<ver>\atlmfc) and has no VC\atlmfc at all,
        # so the compile fails with C1083 atlbase.h / LNK1104 atls.lib even
        # though MSBuild itself resolves ATL fine.
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          $root = Join-Path $vc "atlmfc"
          if (Test-Path (Join-Path $root "include\atlbase.h")) {
            "ATL already at VC root"
            exit 0
          }
          $source = Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory |
            ForEach-Object { Join-Path $_.FullName "atlmfc" } |
            Where-Object { Test-Path (Join-Path $_ "include\atlbase.h") } |
            Sort-Object { [version](Split-Path (Split-Path $_ -Parent) -Leaf) -replace '[^0-9.]','' } |
            Select-Object -Last 1
          if (-not $source) { throw "no ATL headers under $vc\Tools\MSVC" }
          New-Item -ItemType Junction -Path $root -Target $source -Force | Out-Null
          "ATL junction: $root -> $source"

      - name: Native tools environment.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
        # No toolset pin: run_cmake.py passes -T v143, which MSBuild resolves
        # to the newest installed toolset. Pinning an older one left the build
        # on a compiler whose ATL does not exist on the image.

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thecat-thirdparty-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-thirdparty-
          save-always: true

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.os }}-thecat-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-libs-
          save-always: true

      - name: Patch, brand and prepare.
        shell: cmd
        run: call deploy\prepare-win.bat

      - name: Build TheCat.
        shell: cmd
        run: |
          cd /d %TDESKTOP_SRC%
          cmake --build out --config %BUILD_TYPE% --target Telegram --parallel

      - name: Collect TheCat.exe.
        shell: cmd
        run: |
          if not exist tdesktop\out\Release\TheCat.exe (
            echo ::error::build produced no TheCat.exe
            dir tdesktop\out\Release
            exit /b 1
          )
          mkdir artifact
          move tdesktop\out\Release\TheCat.exe artifact\
          if exist tdesktop\out\Release\Updater.exe move tdesktop\out\Release\Updater.exe artifact\

      - name: Upload TheCat.exe.
        uses: actions/upload-artifact@v4
        with:
          name: TheCat-windows-x64
          path: artifact\
          retention-days: 14

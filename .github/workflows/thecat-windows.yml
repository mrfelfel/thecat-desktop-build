name: TheCat Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'logo.*'
      - '.github/**'
      - '!.github/workflows/thecat-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: TheCat Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      TDESKTOP_SRC: ${{ github.workspace }}\tdesktop
      BUILD_TYPE: Release

    steps:
      - name: Clone.
        uses: actions/checkout@v5

      - name: Expose ATL at the VC root.
        shell: pwsh
        # breakpad's gyp-generated projects hardcode "$(VSInstallDir)/VC/atlmfc",
        # i.e. VC\atlmfc at the install root. The runner image only ships ATL
        # inside a toolset (VC\Tools\MSVC\<ver>\atlmfc) and has no VC\atlmfc, so
        # dump_syms fails with C1083 atlbase.h and then LNK1104 atls.lib even
        # though MSBuild resolves ATL on its own.
        #
        # A junction rather than a copy: ATL is small but version-locked, and a
        # link keeps it identical to the toolset that actually compiles.
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          $root = Join-Path $vc "atlmfc"
          if (-not (Test-Path (Join-Path $root "include\atlbase.h"))) {
            # Newest toolset that actually ships ATL.
            $source = Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory |
              ForEach-Object {
                $atl = Join-Path $_.FullName "atlmfc"
                if (Test-Path (Join-Path $atl "include\atlbase.h")) {
                  [pscustomobject]@{ Path = $atl; Version = $_.Name }
                }
              } |
              Sort-Object Version |
              Select-Object -Last 1
            if (-not $source) { throw "no toolset under $vc\Tools\MSVC ships ATL" }
            New-Item -ItemType Junction -Path $root -Target $source.Path -Force | Out-Null
            "ATL ($($source.Version)): $root -> $($source.Path)"
          } else {
            "ATL already present at $root"
          }
          "atlbase.h: $(Test-Path (Join-Path $root 'include\atlbase.h'))"
          "atls.lib : $(Test-Path (Join-Path $root 'lib\x64\atls.lib'))"

      - name: Native tools environment.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
        # No toolset pin: run_cmake.py passes -T v143, which MSBuild resolves
        # to the newest installed toolset. Pinning an older one left the build
        # on a compiler whose ATL does not exist on the image.

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thecat-thirdparty-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-thirdparty-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: Libraries
          key: ${{ runner.os }}-thecat-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-thecat-libs-

      - name: Patch, brand and prepare.
        shell: cmd
        continue-on-error: true
        id: prepare
        run: call deploy\prepare-win.bat

      - name: Make breakpad link ATL.
        # breakpad's dump_syms links atls.lib, but gyp emits an explicit
        # /LIBPATH list (Win7 SDK and DIA SDK only) that overrides LIB, so
        # exporting LIB does nothing. UseOfAtl makes MSBuild contribute the
        # ATL directories itself.
        #
        # This has to run after prepare: patches/ is itself a prepare stage,
        # cloned from desktop-app/patches, and breakpad is only checked out
        # there too. So the patch is applied to the checkout afterwards and
        # prepare is re-run, which resumes at the failed breakpad stage.
        shell: pwsh
        run: |
          $bp = "Libraries\win64\breakpad"
          $gypi = Join-Path $bp "src/build/common.gypi"
          if (-not (Test-Path $gypi)) {
            if ("${{ steps.prepare.outcome }}" -eq "success") {
              "prepare succeeded without breakpad; nothing to patch"
              exit 0
            }
            throw "$gypi not found and prepare failed; see its log"
          }
          $text = [IO.File]::ReadAllText($gypi)
          if ($text -match 'UseOfAtl') {
            "common.gypi already sets UseOfAtl"
          } else {
            $lines = [System.Collections.Generic.List[string]]($text -split "`n")
            $done = $false
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if (-not $done -and $lines[$i] -eq "            ]," -and $i -ge 2 `
                  -and $lines[$i-1] -eq "              'delayimp.lib'," `
                  -and $lines[$i-2] -eq "            'AdditionalDependencies': [") {
                # Inside VCLinkerTool, right after the array closes.
                $lines.Insert($i + 1, "            'UseOfAtl': 'Static',")
                $done = $true
                break
              }
            }
            if (-not $done) {
              throw "could not find AdditionalDependencies in $gypi"
            }
            [IO.File]::WriteAllText($gypi, ($lines -join "`n"))
            "common.gypi now sets UseOfAtl=Static"
          }

          # breakpad keeps its build state outside the source tree, so a rerun
          # resumes there instead of rebuilding the 26 stages before it.
          if ("${{ steps.prepare.outcome }}" -ne "success") {
            Write-Output "::group::prepare (rerun)"
            cmd /c "call deploy\prepare-win.bat"
            $rc = $LASTEXITCODE
            Write-Output "::endgroup::"
            if ($rc -ne 0) { throw "prepare failed again (exit $rc)" }
          }

      - name: Build TheCat.
        shell: cmd
        run: |
          cd /d %TDESKTOP_SRC%
          cmake --build out --config %BUILD_TYPE% --target Telegram --parallel

      - name: Collect TheCat.exe.
        shell: cmd
        run: |
          if not exist tdesktop\out\Release\TheCat.exe (
            echo ::error::build produced no TheCat.exe
            dir tdesktop\out\Release
            exit /b 1
          )
          mkdir artifact
          move tdesktop\out\Release\TheCat.exe artifact\
          if exist tdesktop\out\Release\Updater.exe move tdesktop\out\Release\Updater.exe artifact\

      - name: Upload TheCat.exe.
        uses: actions/upload-artifact@v5
        with:
          name: TheCat-windows-x64
          path: artifact\
          retention-days: 14

      - name: Publish release.
        shell: cmd
        # Shares the tag with the macOS job: both upload into the same release
        # so a download page only has to point at one place.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view thecat-latest >NUL 2>&1 || gh release create thecat-latest --title "TheCat latest" --notes "Automatic build of main (${{ github.sha }})."
          gh release upload thecat-latest artifact\TheCat.exe --clobber

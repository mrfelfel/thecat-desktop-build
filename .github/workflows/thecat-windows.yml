name: TheCat Windows

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: TheCat Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      TDESKTOP_SRC: ${{ github.workspace }}\tdesktop
      BUILD_TYPE: Release
      TOOLSET: 14.44.35207
      # run_cmake.py appends this to its -T v143 so MSBuild cannot pick a
      # second, newer toolset for the app itself.
      VCTOOLSETVERSION: 14.44.35207

    steps:
      - name: Clone.
        uses: actions/checkout@v5

      - name: Expose ATL at the VC root.
        shell: pwsh
        # breakpad's gyp-generated projects hardcode "$(VSInstallDir)/VC/atlmfc",
        # i.e. VC\atlmfc at the install root. The runner image only ships ATL
        # inside a toolset (VC\Tools\MSVC\<ver>\atlmfc) and has no VC\atlmfc, so
        # dump_syms fails with C1083 atlbase.h and then LNK1104 atls.lib even
        # though MSBuild resolves ATL on its own.
        #
        # A junction rather than a copy: ATL is small but version-locked, and a
        # link keeps it identical to the toolset that actually compiles.
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          $root = Join-Path $vc "atlmfc"
          if (-not (Test-Path (Join-Path $root "include\atlbase.h"))) {
            # Newest toolset that actually ships ATL.
            $source = Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory |
              ForEach-Object {
                $atl = Join-Path $_.FullName "atlmfc"
                if (Test-Path (Join-Path $atl "include\atlbase.h")) {
                  [pscustomobject]@{ Path = $atl; Version = $_.Name }
                }
              } |
              Sort-Object Version |
              Select-Object -Last 1
            if (-not $source) { throw "no toolset under $vc\Tools\MSVC ships ATL" }
            New-Item -ItemType Junction -Path $root -Target $source.Path -Force | Out-Null
            "ATL ($($source.Version)): $root -> $($source.Path)"
          } else {
            "ATL already present at $root"
          }
          "atlbase.h: $(Test-Path (Join-Path $root 'include\atlbase.h'))"
          "atls.lib : $(Test-Path (Join-Path $root 'lib\x64\atls.lib'))"

      - name: Native tools environment.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          # Pin the toolset instead of taking the newest on PATH. The image
          # ships two, and this has to agree with whatever vcvars picks when
          # prepare compiles the dependencies: MSVC 14.4x headers emit
          # vectorized std:: helpers (__std_rotate, __std_max_element_4i, ...)
          # that the 14.5x libraries no longer export, so an object built by
          # one toolset cannot link against libraries built by the other. A
          # mismatch only surfaces on a cold build, because restored Libraries
          # carry whichever toolset built them.
          toolset: ${{ env.TOOLSET }}

      - name: Restore prepared Libraries.
        id: deps
        uses: actions/download-artifact@v5
        with:
          name: thecat-windows-deps-mt1444
          path: .
          # Two artifacts sharing this name (an old one left behind) make this
          # action report "Artifact not found", which is indistinguishable
          # from the artifact never existing. Say so instead of silently
          # starting a 4-hour cold build.
          if-no-files-found: error

      - name: Patch, brand and prepare.
        shell: cmd
        # With the artifact in place, prepare is a no-op: every stage finds a
        # good cache key and skips. Without it, this is the full 90 minutes.
        run: call deploy\prepare-win.bat

      - name: Check the toolset did not move.
        shell: pwsh
        # prepare runs its own vcvars. If that resolves a different toolset
        # than the one pinned above, the libraries it just built and the
        # objects the build is about to compile disagree about __std_*
        # symbols, and the failure surfaces much later as an unreadable link
        # error. Fail here with the two versions instead.
        run: |
          $pinned = "${{ env.TOOLSET }}"
          $cl = (Get-Command cl.exe).Source
          "cl on PATH: $cl"
          if ($cl -notlike "*${pinned}*") {
            throw "cl.exe is not from the pinned toolset $pinned : $cl"
          }

      - name: Check the MP cap reached the project.
        shell: pwsh
        # A -D split across two argv tokens is silently accepted and ignored,
        # which is how an earlier cap ran for a whole build without applying.
        # Ask the configured cache rather than trusting the command line.
        run: |
          $cache = "tdesktop\out\CMakeCache.txt"
          if (-not (Test-Path $cache)) { throw "missing $cache" }
          $line = Select-String -Path $cache -Pattern '^tdesktop_msvc_mp_count:' |
            Select-Object -First 1
          "cache: $($line.Line)"
          if (-not ($line -and $line.Line -match '=2$')) {
            throw "tdesktop_msvc_mp_count is not 2; the cap did not reach cmake"
          }

      - name: Build TheCat.
        shell: cmd
        # The runner has 4 cores and 16 GB. Left alone, cl.exe happily starts
        # 29 compilations in one second on this one huge vcxproj, and each one
        # pulls in all of lib_rpl and range-v3, so the box runs out and cl
        # reports C1060 in a different header every run.
        #
        # Neither knob used here is the one that looks right:
        #   - `-- /m:1` only caps MSBuild *nodes*, and a single vcxproj is one
        #     node, so cl inside it still fans out.
        #   - /MP<n> in options_win.cmake reaches the compile line but MSBuild
        #     also sets its own, and the last one wins.
        # CL_MPCount is the property MSBuild itself translates into /MP, so it
        # is the one that sticks. CMAKE_BUILD_PARALLEL_LEVEL caps cmake's own
        # target-level parallelism on top of that.
        run: |
          cd /d %TDESKTOP_SRC%
          set CMAKE_BUILD_PARALLEL_LEVEL=1
          cmake --build out --config %BUILD_TYPE% --target Telegram -- /m:1 /p:CL_MPCount=2

      - name: Collect TheCat.exe.
        shell: cmd
        run: |
          if not exist tdesktop\out\Release\TheCat.exe (
            echo ::error::build produced no TheCat.exe
            dir tdesktop\out\Release
            exit /b 1
          )
          mkdir artifact
          move tdesktop\out\Release\TheCat.exe artifact\
          if exist tdesktop\out\Release\Updater.exe move tdesktop\out\Release\Updater.exe artifact\

      - name: Upload TheCat.exe.
        uses: actions/upload-artifact@v5
        with:
          name: TheCat-windows-x64
          path: artifact\
          retention-days: 14

      - name: Publish release.
        shell: cmd
        # Shares the tag with the macOS job: both upload into the same release
        # so a download page only has to point at one place.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view thecat-latest >NUL 2>&1 || gh release create thecat-latest --title "TheCat latest" --notes "Automatic build of main (${{ github.sha }})."
          gh release upload thecat-latest artifact\TheCat.exe --clobber

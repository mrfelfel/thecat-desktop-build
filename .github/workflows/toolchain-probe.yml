name: Toolchain probe

# Temporary diagnostic for the TheCat Windows build. Cheap (minutes) and safe
# to delete once the TheCat Windows workflow is green.

on:
  workflow_dispatch:

jobs:
  probe:
    name: ATL probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Where ATL actually lives.
        shell: pwsh
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          "== VC root =="
          Get-ChildItem $vc -Directory | Select-Object -Expand Name
          $rootAtl = Join-Path $vc "atlmfc"
          "== VC\atlmfc (what breakpad vcxproj asks for) =="
          "exists=$(Test-Path $rootAtl)"
          "atlbase=$(Test-Path (Join-Path $rootAtl 'include\atlbase.h'))"
          "atls=$(Test-Path (Join-Path $rootAtl 'lib\x64\atls.lib'))"
          "== per toolset =="
          Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory | ForEach-Object {
            $a = Join-Path $_.FullName "atlmfc"
            "$($_.Name): include=$(Test-Path (Join-Path $a 'include\atlbase.h')) lib=$(Test-Path (Join-Path $a 'lib\x64\atls.lib'))"
          }
          "== every atlbase.h in the install =="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\18" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue |
            Select-Object -First 10 -Expand FullName

      - name: Which toolset resolves for MSBuild.
        shell: pwsh
        run: |
          Get-Content tools/probe_atl.ps1 -Raw | Invoke-Expression

      - name: After exposing ATL at the VC root.
        shell: pwsh
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          $root = Join-Path $vc "atlmfc"
          if (-not (Test-Path (Join-Path $root "include\atlbase.h"))) {
            $source = Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory |
              ForEach-Object { Join-Path $_.FullName "atlmfc" } |
              Where-Object { Test-Path (Join-Path $_ "include\atlbase.h") } |
              Select-Object -Last 1
            if (-not $source) { throw "no ATL headers found" }
            New-Item -ItemType Junction -Path $root -Target $source -Force | Out-Null
            "junction: $root -> $source"
          }
          "atlbase at root = $(Test-Path (Join-Path $root 'include\atlbase.h'))"

      - name: Simulate breakpad's hardcoded include path.
        shell: pwsh
        run: |
          $vsInstall = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\"
          $inc = $vsInstall + "VC\atlmfc\include"
          $lib = $vsInstall + "VC\atlmfc\lib\x64"
          "include=$inc exists=$(Test-Path (Join-Path $inc 'atlbase.h'))"
          "lib=$lib exists=$(Test-Path (Join-Path $lib 'atls.lib'))"
          New-Item -ItemType Directory -Force probe2 | Out-Null
          Set-Location probe2
          "#include <atlbase.h>" | Out-File -Encoding ascii t.cpp
          "int main(){ return 0; }" | Out-File -Encoding ascii main.cpp
          # Same shape as breakpad: /I with the hardcoded VC path, /WX /O2 /MT
          & cl /c "/I$inc" /O2 /MT /WX t.cpp 2>&1 | Select-Object -First 5
          "cl exit = $LASTEXITCODE"

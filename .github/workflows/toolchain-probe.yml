name: Toolchain probe

# Temporary diagnostic for the TheCat Windows build. Cheap (minutes) and safe
# to delete once the TheCat Windows workflow is green.

on:
  workflow_dispatch:

jobs:
  probe:
    name: ATL probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Where ATL actually lives.
        shell: pwsh
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC"
          "== VC root =="
          Get-ChildItem $vc -Directory | Select-Object -Expand Name
          $rootAtl = Join-Path $vc "atlmfc"
          "== VC\atlmfc (what breakpad vcxproj asks for) =="
          "exists=$(Test-Path $rootAtl)"
          "atlbase=$(Test-Path (Join-Path $rootAtl 'include\atlbase.h'))"
          "atls=$(Test-Path (Join-Path $rootAtl 'lib\x64\atls.lib'))"
          "== per toolset =="
          Get-ChildItem (Join-Path $vc "Tools\MSVC") -Directory | ForEach-Object {
            $a = Join-Path $_.FullName "atlmfc"
            "$($_.Name): include=$(Test-Path (Join-Path $a 'include\atlbase.h')) lib=$(Test-Path (Join-Path $a 'lib\x64\atls.lib'))"
          }
          "== every atlbase.h in the install =="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\18" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue |
            Select-Object -First 10 -Expand FullName

      - name: Which toolset resolves for MSBuild.
        shell: pwsh
        run: |
          Get-Content tools/probe_atl.ps1 -Raw | Invoke-Expression
